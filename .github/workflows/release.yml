name: Release

# Triggered on every push to main. The changesets/action step determines
# whether a release PR should be opened (when .changeset/*.md files exist)
# or packages should be published (when a "Version Packages" PR is merged).

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Pre-release validation
  # ═══════════════════════════════════════════════════════════════════════

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-release-${{ hashFiles('bun.lock', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: |
            turbo-release-
            turbo-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeCheck
        run: bun turbo typecheck

      - name: Lint (strict)
        run: bun run lint

      - name: Test
        run: bun turbo test

      - name: Integration Tests
        run: bun turbo integration

      - name: Build
        run: bun turbo build

  # ═══════════════════════════════════════════════════════════════════════
  # Version & Publish
  # ═══════════════════════════════════════════════════════════════════════

  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate]
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-release-${{ hashFiles('bun.lock', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: |
            turbo-release-
            turbo-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun turbo build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun changeset version
          # Provenance is enabled per-package via publishConfig.provenance: true
          # (npm attaches a Sigstore attestation using the OIDC id-token above.)
          publish: bun changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
