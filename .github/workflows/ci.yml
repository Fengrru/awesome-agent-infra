name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

# ────────────────────────────────────────────────────────────────────────────
# Pipeline design:
#
#   Stage 0 (parallel, no build required):
#     typecheck  — tsc --noEmit across all 43 packages
#     lint       — biome check --error-on-warnings
#     lockfile   — verify bun.lock is consistent
#
#   Stage 1 (parallel, needs typecheck):
#     test       — bun test on ubuntu/windows/macos
#     integration— cross-package integration tests
#
#   Stage 2 (parallel, needs typecheck):
#     coverage   — per-package lcov gate (85%+ threshold)
#     build      — tsc emit + dist verification
#     bench      — benchmark smoke (crash/hang detection)
#     docs       — typedoc generation check
#
# Turbo cache keys use content hashing (lockfile + configs) so unchanged
# packages hit the cache across commits.
# ────────────────────────────────────────────────────────────────────────────

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Stage 0 — Static Analysis
  # ═══════════════════════════════════════════════════════════════════════

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ hashFiles('bun.lock', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: |
            turbo-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeCheck (all packages)
        run: bun turbo typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ hashFiles('bun.lock', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: |
            turbo-lint-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (strict, all packages)
        run: bun run lint

  lockfile:
    name: Lockfile Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify lockfile is consistent
        run: |
          bun install --frozen-lockfile
          echo "OK: bun.lock is consistent with all package.json manifests."

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 1 — Runtime Validation
  # ═══════════════════════════════════════════════════════════════════════

  test:
    name: Test (${{ matrix.os }})
    needs: [typecheck]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: |
            turbo-test-${{ runner.os }}-
            turbo-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (all packages)
        run: bun turbo test

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "--- bun version ---"
          bun --version
          echo "--- os info ---"
          echo "runner: ${{ runner.os }}"
          uname -a 2>/dev/null || echo "(uname not available)"

  integration:
    name: Integration Tests
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-integration-${{ hashFiles('bun.lock', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: |
            turbo-integration-
            turbo-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integration Tests
        run: bun turbo integration

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 2 — Quality Gates
  # ═══════════════════════════════════════════════════════════════════════

  coverage:
    name: Coverage Gate
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-coverage-${{ hashFiles('bun.lock', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: |
            turbo-coverage-
            turbo-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Coverage (85%+ per gated package)
        run: bun scripts/check-coverage.ts

  build:
    name: Build
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ hashFiles('bun.lock', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: |
            turbo-build-
            turbo-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (all packages)
        run: bun turbo build

      - name: Verify dist outputs
        run: |
          PKG_COUNT=$(find packages -maxdepth 3 -name "index.js" -path "*/dist/*" 2>/dev/null | wc -l)
          echo "packages with dist/index.js: $PKG_COUNT"
          if [ "$PKG_COUNT" -eq 0 ]; then
            echo "ERROR: No dist outputs found."
            exit 1
          fi
          echo "OK: $PKG_COUNT package(s) built successfully."

  bench:
    name: Benchmarks (smoke)
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeCheck benchmarks
        run: bunx tsc --noEmit -p benchmarks/tsconfig.json

      - name: Build workspace deps used by benchmarks
        # agent-memory/src/bridge.ts imports @fengru/memory-engine-v2 by package
        # name; benchmarks import src directly, so its dist must exist at runtime.
        run: bun turbo build --filter=@fengru/memory-engine-v2

      - name: Run benchmarks (smoke)
        working-directory: benchmarks
        run: bun run-all.ts

  docs:
    name: Docs Build
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-docs-${{ hashFiles('bun.lock', 'turbo.json', 'tsconfig.base.json') }}
          restore-keys: |
            turbo-docs-
            turbo-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages (TypeDoc needs cross-package deps)
        run: bun turbo build

      - name: Generate TypeDoc
        run: bun run docs

  # ═══════════════════════════════════════════════════════════════════════
  # Diagnostic: codegraph verbose test (temporary, root-cause Linux failures)
  # ═══════════════════════════════════════════════════════════════════════

  debug-codegraph:
    name: Debug Codegraph (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run codegraph tests with verbose output
        working-directory: packages/codegraph
        run: |
          echo "=== Bun version ==="
          bun --version
          echo "=== Check for tree-sitter packages ==="
          ls node_modules/web-tree-sitter 2>/dev/null && echo "FOUND: web-tree-sitter" || echo "NOT FOUND: web-tree-sitter"
          ls node_modules/tree-sitter-typescript 2>/dev/null && echo "FOUND: tree-sitter-typescript" || echo "NOT FOUND: tree-sitter-typescript"
          ls node_modules/tree-sitter-javascript 2>/dev/null && echo "FOUND: tree-sitter-javascript" || echo "NOT FOUND: tree-sitter-javascript"
          echo "=== Test extractor.test.ts (fallback only) ==="
          bun test __tests__/extractor.test.ts 2>&1 || true
          echo "=== Test builder.test.ts ==="
          bun test __tests__/builder.test.ts 2>&1 || true
          echo "=== Full test suite ==="
          bun test 2>&1 || true

  # ═══════════════════════════════════════════════════════════════════════
  # Final Gate -- aggregator for branch-protection required check
  # ═══════════════════════════════════════════════════════════════════════

  gate:
    name: CI Gate
    if: always()
    needs: [typecheck, lint, lockfile, test, integration, coverage, build, bench, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Aggregate results
        run: |
          echo "## CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          PASS=0
          FAIL=0
          SKIP=0

          check() {
            local job="$1"
            local result="$2"
            case "$result" in
              success)
                echo "- [PASS] **$job**" >> "$GITHUB_STEP_SUMMARY"
                PASS=$((PASS + 1))
                ;;
              skipped)
                echo "- [SKIP] **$job**" >> "$GITHUB_STEP_SUMMARY"
                SKIP=$((SKIP + 1))
                ;;
              *)
                echo "- [FAIL] **$job** (result: $result)" >> "$GITHUB_STEP_SUMMARY"
                FAIL=$((FAIL + 1))
                ;;
            esac
          }

          check "typecheck"     "${{ needs.typecheck.result }}"
          check "lint"          "${{ needs.lint.result }}"
          check "lockfile"      "${{ needs.lockfile.result }}"
          check "test"          "${{ needs.test.result }}"
          check "integration"   "${{ needs.integration.result }}"
          check "coverage"      "${{ needs.coverage.result }}"
          check "build"         "${{ needs.build.result }}"
          check "bench"         "${{ needs.bench.result }}"
          check "docs"          "${{ needs.docs.result }}"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Passed:** $PASS | **Failed:** $FAIL | **Skipped:** $SKIP" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "CI failed — $FAIL job(s) did not pass." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All $PASS checks passed." >> "$GITHUB_STEP_SUMMARY"
